# akustik.saggplus.com — SAGG Akustik Hesap Aracı (statik web sürümü) giriş kapısı.
#
# Her istek, saggplus.com Next.js uygulamasındaki /api/akustik/dogrula ucuna
# sorulur (auth_request). Oturum yoksa, iptal edildiyse ya da demo süresi
# dolduysa kullanıcı /akustik/giris sayfasına yönlendirilir.
#
# Varsayımlar (kendi sunucunuza göre değiştirin):
#   - Next.js uygulaması 127.0.0.1:3000'de çalışıyor (npm start / pm2).
#   - SAGG-Akustik_Rapor deposunun dosyaları /var/www/akustik altında.
#   - SSL sertifikası certbot ile alınmış.
#
# ÖNEMLİ: Eski "auth_basic" / htpasswd satırlarını bu sunucu bloğundan kaldırın;
# giriş artık yönetim panelindeki "Akustik Kullanıcıları" sayfasından yönetilir.

upstream saggplus_next {
    server 127.0.0.1:3000;
}

server {
    listen 443 ssl http2;
    server_name akustik.saggplus.com;

    ssl_certificate     /etc/letsencrypt/live/akustik.saggplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akustik.saggplus.com/privkey.pem;

    root  /var/www/akustik;
    index index.html;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Korumasız: giriş sayfası ve oturum uçları (Next.js) ---------------
    location = /akustik/giris            { proxy_pass http://saggplus_next; }
    location /_next/                     { proxy_pass http://saggplus_next; }
    location = /api/akustik/giris        { proxy_pass http://saggplus_next; }
    location = /api/akustik/cikis        { proxy_pass http://saggplus_next; }
    location = /api/akustik/oturum       { proxy_pass http://saggplus_next; }

    # --- Oturum denetimi (yalnızca Nginx içinden çağrılır) -----------------
    location = /__akustik_dogrula {
        internal;
        proxy_pass http://saggplus_next/api/akustik/dogrula;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # --- Korumalı: hesap aracının kendisi ----------------------------------
    location / {
        auth_request /__akustik_dogrula;
        error_page 401 = @akustik_giris;

        # Sayfa her açılışta sunucuya sorulsun; süre dolunca önbellekten açılmasın.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location @akustik_giris {
        return 302 /akustik/giris?next=$uri;
    }
}

server {
    listen 80;
    server_name akustik.saggplus.com;
    return 301 https://$host$request_uri;
}
