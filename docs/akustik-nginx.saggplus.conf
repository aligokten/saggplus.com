# akustik.saggplus.com — saggplus-web sunucusuna özel, kullanıma hazır sürüm.
#
# docs/akustik-nginx.conf genel bir örnektir; bu dosya ise bu sunucunun gerçek
# değerleriyle doldurulmuş hâlidir ve doğrudan kopyalanabilir:
#
#   sudo cp ~/saggplus.com/docs/akustik-nginx.saggplus.conf \
#           /etc/nginx/sites-available/akustik
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sunucu değerleri: Next.js 127.0.0.1:3000 (pm2 adı "saggplus"), akustik
# dosyaları /var/www/akustik, sertifika certbot ile alınmış.
#
# Alttaki "managed by Certbot" satırları sunucudaki mevcut yapılandırmadan
# birebir alınmıştır; certbot yenilemelerinin bozulmaması için değiştirmeyin.
# Eski auth_basic / htpasswd kurulumu bu dosyada bilinçli olarak yoktur:
# giriş artık /admin/akustik sayfasından yönetiliyor.

upstream saggplus_next {
    server 127.0.0.1:3000;
}

server {
    server_name akustik.saggplus.com;

    root  /var/www/akustik;
    index index.html;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Korumasız: giriş sayfası ve oturum uçları (Next.js) ---------------
    location = /akustik/giris      { proxy_pass http://saggplus_next; }
    location /_next/               { proxy_pass http://saggplus_next; }
    location = /api/akustik/giris  { proxy_pass http://saggplus_next; }
    location = /api/akustik/cikis  { proxy_pass http://saggplus_next; }
    location = /api/akustik/oturum { proxy_pass http://saggplus_next; }

    # --- Oturum denetimi (yalnızca Nginx içinden çağrılır) -----------------
    location = /__akustik_dogrula {
        internal;
        proxy_pass http://saggplus_next/api/akustik/dogrula;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # --- Korumalı: hesap aracının kendisi ----------------------------------
    location / {
        auth_request /__akustik_dogrula;
        error_page 401 = @akustik_giris;

        # Süre dolunca sayfa önbellekten açılmasın.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location @akustik_giris {
        return 302 /akustik/giris?next=$uri;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/akustik.saggplus.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/akustik.saggplus.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = akustik.saggplus.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name akustik.saggplus.com;
    return 404; # managed by Certbot
}
